; Standalone ESP32 project: WiFi potmeter + OLED controller for an
; SMA Sunny Boy inverter over Modbus TCP. Independent of the ESPEasy
; build in the rest of this repo (different platform/toolchain).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/ArduinoModbus @ ^1.0.9
    arduino-libraries/ArduinoRS485 @ ^1.0.4
    fdebrabander/LiquidCrystal_I2C @ ^1.1.2
    tzapu/WiFiManager @ ^2.0.17
