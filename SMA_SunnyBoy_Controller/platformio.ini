; Standalone ESP32 project: WiFi potmeter + LCD controller for an
; SMA Sunny Boy inverter over Modbus TCP. Independent of the ESPEasy
; build in the rest of this repo (different platform/toolchain).
;
; Modbus TCP is hand-rolled on top of WiFiClient (see main.cpp) -
; the official ArduinoModbus/ArduinoRS485 libraries only target
; SAMD/megaAVR/mbed boards and fail to build for ESP32.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    fdebrabander/LiquidCrystal_I2C @ ^1.1.2
    tzapu/WiFiManager @ ^2.0.17
